<!DOCTYPE html>
<html>
  <body style="background-color: blue;">
    <div id="content-div">
      <h1 style="color: aqua;">
        Hello 
      </h1>
      <a href="/information">
        This is a text project
      </a>
      <img src="image/Screenshot 2025-03-17 211317.png" alt="image" width="100" height="100">
    </div>
    <div>
      <button onclick="callAPI()">
        <p>Call API</p>
      </button>
      
      <div id="api-response" style="margin-top: 20px; padding: 15px; background-color: rgba(255, 255, 255, 0.8); border-radius: 5px; color: black;">
        API response will appear here
      </div>
      
      <script>
        async function callAPI() {
          console.log("Calling API...");
          
          // Update the response div to show loading status
          const responseDiv = document.getElementById("api-response");
          responseDiv.innerHTML = "Loading...";
          
          try {
            // Call a test API (JSONPlaceholder is a free testing API)
            const response = await fetch('https://jsonplaceholder.typicode.com/todos/1');
            
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            
            // Parse the JSON response
            const data = await response.json();
            console.log("API response:", data);
            
            // Display the response in the div
            responseDiv.innerHTML = `
              <h3>API Response:</h3>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
          } catch (error) {
            console.error("Error calling API:", error);
            responseDiv.innerHTML = `
              <h3>Error:</h3>
              <p>${error.message}</p>
            `;
          }
        }
      </script>
    </div>
  </body>
</html>
