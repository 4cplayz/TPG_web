<!DOCTYPE html>
<html>
<head>
    <title>Gestion des exemplaires</title>
</head>
<body id="app">
    <h1>Exemplaires de l'équipement</h1>
    <h2>{{message}}</h2>
    <button @click="obtenirExemplaires">Rafraîchir la liste</button>
    
    <div v-if="exemplaires.length">
        <ul>
            <li v-for="exemplaire in exemplaires" :key="exemplaire._id">
                {{exemplaire}}
            </li>
        </ul>
    </div>
    <div v-else>
        Aucun exemplaire trouvé
    </div>

    <h3>POST - Add New Exemplaire</h3>
    <div style="margin-top: 20px;">
        <label for="label" style="display: block; margin-bottom: 5px; font-weight: bold;">Labe:</label>
        <input 
          type="text" 
          id="label" 
          v-model="nouveaulabel" 
          style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"
        >
    </div>

    <button  @click="ajouterExmplaires">Ajouter</button>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp, ref } = Vue
        
        createApp({
            setup() {
                const message = ref("Chargement des exemplaires...")
                const exemplaires = ref([])
                const nouveaulabel = ref('')
                const postResponse = ref('')
                const equipement_id = window.location.pathname.split("/").pop()
                const urlPourRequete = "/api/equipements/" + equipement_id + "/exemplaires"
                console.log(urlPourRequete)

                async function obtenirExemplaires() {
                    try {
                        message.value = "Chargement des exemplaires..."
                        const reponse = await fetch(urlPourRequete, { method: 'GET' })
                        const exs = await reponse.json()
                        exemplaires.value = exs
                        message.value = exs.length ? `${exs.length} exemplaires trouvés` : "Aucun exemplaire trouvé"
                    } catch (error) {
                        console.error('Error fetching exemplaires:', error)
                        message.value = "Erreur lors du chargement des exemplaires"
                    }
                }

                async function ajouterExmplaires() {
                    try {
                        postResponse.value = 'Envoi en cours...'

                        const response = await fetch(urlPourRequete, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                label: nouveaulabel.value,
                                equipement: equipement_id
                            })
                        })
                        
                        const result = await response.text()
                        postResponse.value = result

                        nouveaulabel.value = ''

                        obtenirExemplaires()
                    }
                    catch (error) {
                        console.error('Error adding equipement:', error)
                        postResponse.value = 'Erreur: ' + error.message
                    }
                }

                // Appel initial
                obtenirExemplaires()

                // Retourner les variables et fonctions pour qu'elles soient disponibles dans le template
                return {
                    message,
                    exemplaires,
                    obtenirExemplaires,
                    ajouterExmplaires,
                    nouveaulabel,
                    postResponse
                    
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
