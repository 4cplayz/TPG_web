<!DOCTYPE html>
<html>
<head>
    <title>Gestion des exemplaires</title>
</head>
<body id="app">
    <h1>Exemplaires de l'équipement</h1>
    <h2>{{message}}</h2>
    <button @click="obtenirExemplaires">Rafraîchir la liste</button>
    
    <div v-if="exemplaires.length">
        <ul>
            <div v-for="exemplaire in exemplaires" style="display: flex; flex-direction: row;">
                <div style="display: flex; flex-direction: columns; gap: 20px;">
                    <p>Label : {{exemplaire.label}}</p>
                    <p>Date : {{formatDate(exemplaire.date)}}</p>
                </div>
                <button @click="supprimerExemplaires(exemplaire._id)" style="margin-left: 20px;"> Supprimer </button>
            </div>
        </ul>
    </div>
    <div v-else>
        Aucun exemplaire trouvé
    </div>

    <h3>POST - Add New Exemplaire</h3>
    <div style="margin-top: 20px;">
        <label for="label" style="display: block; margin-bottom: 5px; font-weight: bold; ">Label:</label>
        <input 
          type="text" 
          id="label" 
          v-model="nouveaulabel" 
          style="width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"
          @input="validateInput"
        >
        <p v-if="errorMessage" style="color: red; margin-top: 5px;">{{ errorMessage }}</p>
    </div>

    <button @click="ajouterExmplaires" :disabled="!isValidInput" :style="buttonStyle">Ajouter</button>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp, ref, computed } = Vue
        
        createApp({
            setup() {
                const message = ref("Chargement des exemplaires...")
                const exemplaires = ref([])
                const nouveaulabel = ref('')
                const errorMessage = ref('')
                const postResponse = ref('')
                const equipement_id = window.location.pathname.split("/").pop()
                const urlPourRequete = "/api/equipements/" + equipement_id + "/exemplaires"
                console.log(urlPourRequete)

                const isValidInput = computed(() => {
                    return nouveaulabel.value.trim() !== ''
                })

                const buttonStyle = computed(() => {
                    return {
                        backgroundColor: isValidInput.value ? '#4CAF50' : '#cccccc',
                        color: 'white',
                        padding: '10px 15px',
                        border: 'none',
                        borderRadius: '4px',
                        cursor: isValidInput.value ? 'pointer' : 'not-allowed',
                        marginTop: '10px'
                    }
                })

                function validateInput() {
                    if (nouveaulabel.value.trim() === '') {
                        errorMessage.value = 'Le label ne peut pas être vide'
                    } else {
                        errorMessage.value = ''
                    }
                }

                function formatDate(timestamp) {
                    if (!timestamp) return 'No date';
                    const date = new Date(timestamp);
                    // Format as: Day Month Year, Hour:Minute
                    return date.toLocaleDateString() + ', ' + date.toLocaleTimeString();
                }

                async function obtenirExemplaires() {
                    try {
                        message.value = "Chargement des exemplaires..."
                        const reponse = await fetch(urlPourRequete, { method: 'GET' })
                        const exs = await reponse.json()
                        exemplaires.value = exs
                        message.value = exs.length ? `${exs.length} exemplaires trouvés` : "Aucun exemplaire trouvé"
                    } catch (error) {
                        console.error('Error fetching exemplaires:', error)
                        message.value = "Erreur lors du chargement des exemplaires"
                    }
                }

                async function ajouterExmplaires() {
                    if (!isValidInput.value) {
                        errorMessage.value = "Veuillez remplir le champ label"
                        return
                    }
                    try {
                        postResponse.value = 'Envoi en cours...'

                        const response = await fetch(urlPourRequete, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                label: nouveaulabel.value
                            })
                        })
                        
                        const result = await response.text()
                        postResponse.value = result

                        nouveaulabel.value = ''
                        errorMessage.value = ''

                        obtenirExemplaires()
                    }
                    catch (error) {
                        console.error('Error adding exemplaires:', error)
                        postResponse.value = 'Erreur: ' + error.message
                    }
                }

                async function supprimerExemplaires(id) {
                    try {
                        const response = await fetch(`/api/exemplaires/${id}`, {
                            method: 'DELETE'
                        })

                        obtenirExemplaires()

                    }
                    catch (error) {
                        console.error('Error deleting exemplaires:', error)
                    }
                }

                // Appel initial
                obtenirExemplaires()

                // Retourner les variables et fonctions pour qu'elles soient disponibles dans le template
                return {
                    message,
                    exemplaires,
                    obtenirExemplaires,
                    ajouterExmplaires,
                    nouveaulabel,
                    postResponse,
                    supprimerExemplaires,
                    formatDate,
                    isValidInput,
                    buttonStyle,
                    errorMessage,
                    validateInput
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
