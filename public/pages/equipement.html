<!DOCTYPE html>
<html>
<head>
    <title>Titre</title>
</head>
<body id="app">
    <h1>Ajouter du contenu</h1>
    <h2>{{message}}</h2>
    <button @click="bipper">cliquez ici</button>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp, ref } = Vue

        createApp({
            setup() {
                const message = ref('Bonjour!')

                async function bipper() {
                    alert('Bip!')
                }

                return { message, bipper }
            }
        }).mount('#app')
    </script>
</body>
</html>
